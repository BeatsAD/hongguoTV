# SPDX-License-Identifier: MIT
name: 功能建议
description: 描述希望解决的问题及电视上的使用场景。
title: '[建议] '
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议。提供使用场景即可，无需预先确定技术方案；提交建议不表示项目已经承诺排期。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？
      description: 目前在哪个场景不方便，受影响的用户是谁？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望的使用方式
      description: 尽量描述页面、遥控器按键、反馈和返回行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法
      description: 目前如何处理，为什么仍需要改进？
  - type: textarea
    id: compatibility
    attributes:
      label: 设备与兼容性要求
      description: 如有特定电视、Android 版本、字号、遥控器或解码需求，请说明。
  - type: textarea
    id: examples
    attributes:
      label: 示例与补充材料
      description: 可附示意图或公开参考链接；请勿附私人数据、账号或密钥。
